services:
  - type: web
    name: authflow-web
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Haradi Bots
      - key: PUBLIC_BASE_URL
        value: https://haradibots.onrender.com
      - key: MAIL_SENDER_NAME
        value: Haradi Bots
      - key: TASK_QUEUE_ASYNC
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: EMAIL_BACKEND
        value: auto
      - key: EMAIL_DELIVERY_ORDER
        value: resend,sendgrid,smtp,file
      - key: EMAIL_FILE_FALLBACK
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: UPLOAD_STORAGE_BUCKET
        value: uploads
      - key: BACKUP_STORAGE_BUCKET
        value: backups
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: authflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: authflow-redis
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: redis
          name: authflow-redis
          property: connectionString

  - type: worker
    name: authflow-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: rq worker -u $REDIS_URL default notifications maintenance
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Haradi Bots
      - key: PUBLIC_BASE_URL
        value: https://haradibots.onrender.com
      - key: MAIL_SENDER_NAME
        value: Haradi Bots
      - key: TASK_QUEUE_ASYNC
        value: "true"
      - key: SKIP_DB_MIGRATIONS
        value: "true"
      - key: EMAIL_BACKEND
        value: auto
      - key: EMAIL_DELIVERY_ORDER
        value: resend,sendgrid,smtp,file
      - key: EMAIL_FILE_FALLBACK
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: UPLOAD_STORAGE_BUCKET
        value: uploads
      - key: BACKUP_STORAGE_BUCKET
        value: backups
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: authflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: authflow-redis
          property: connectionString

  - type: redis
    name: authflow-redis
    plan: free
    ipAllowList: []

databases:
  - name: authflow-postgres
    plan: free
