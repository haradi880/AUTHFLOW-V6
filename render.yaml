services:
  - type: web
    name: authflow-web
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TASK_QUEUE_ASYNC
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: authflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: authflow-redis
          property: connectionString

  - type: worker
    name: authflow-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: rq worker -u $REDIS_URL default notifications maintenance
    envVars:
      - key: APP_ENV
        value: production
      - key: TASK_QUEUE_ASYNC
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: authflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: authflow-redis
          property: connectionString

  - type: redis
    name: authflow-redis
    plan: free
    ipAllowList: []

databases:
  - name: authflow-postgres
    plan: free
