services:
  - type: web
    name: haradibots-web
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: HaradiBots
      - key: PUBLIC_BASE_URL
        value: https://haradibots.onrender.com
      - key: MAIL_SENDER_NAME
        value: HaradiBots
      - key: TASK_QUEUE_ASYNC
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_DELIVERY_ORDER
        value: smtp
      - key: EMAIL_FILE_FALLBACK
        value: "false"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_FORCE_IPV4
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: UPLOAD_STORAGE_BUCKET
        value: uploads
      - key: PRIVATE_UPLOAD_STORAGE_BUCKET
        value: private-uploads
      - key: BACKUP_STORAGE_BUCKET
        value: backups
      - key: UPLOAD_KEEP_LOCAL
        value: "false"
      - key: MAX_CONTENT_LENGTH
        value: "26214400"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: MESSAGE_ATTACHMENT_MAX_BYTES
        value: "26214400"
      - key: METRICS_TOKEN
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: haradibots-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: haradibots-redis
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: haradibots-redis
          property: connectionString

  - type: worker
    name: haradibots-worker
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: rq worker -u $REDIS_URL default notifications maintenance
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: HaradiBots
      - key: PUBLIC_BASE_URL
        value: https://haradibots.onrender.com
      - key: MAIL_SENDER_NAME
        value: HaradiBots
      - key: TASK_QUEUE_ASYNC
        value: "true"
      - key: SKIP_DB_MIGRATIONS
        value: "true"
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_DELIVERY_ORDER
        value: smtp
      - key: EMAIL_FILE_FALLBACK
        value: "false"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_FORCE_IPV4
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: UPLOAD_STORAGE_BUCKET
        value: uploads
      - key: PRIVATE_UPLOAD_STORAGE_BUCKET
        value: private-uploads
      - key: BACKUP_STORAGE_BUCKET
        value: backups
      - key: UPLOAD_KEEP_LOCAL
        value: "false"
      - key: MAX_CONTENT_LENGTH
        value: "26214400"
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: MESSAGE_ATTACHMENT_MAX_BYTES
        value: "26214400"
      - key: METRICS_TOKEN
        generateValue: true
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: haradibots-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: haradibots-redis
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: haradibots-redis
          property: connectionString

  - type: keyvalue
    name: haradibots-redis
    plan: free
    ipAllowList: []

databases:
  - name: haradibots-postgres
    plan: free
