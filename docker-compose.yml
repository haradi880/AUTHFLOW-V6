services:
  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-haradibots}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-haradibots}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      METRICS_TOKEN: ${METRICS_TOKEN:-change-me-metrics-token}
      UPLOAD_KEEP_LOCAL: "false"
      MAX_CONTENT_LENGTH: "26214400"
      MAX_UPLOAD_BYTES: "26214400"
      MESSAGE_ATTACHMENT_MAX_BYTES: "26214400"
    depends_on:
      - postgres
      - redis
    volumes:
      - logs:/app/logs
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-haradibots}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-haradibots}
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      TASK_QUEUE_ASYNC: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:-change-me-metrics-token}
      UPLOAD_KEEP_LOCAL: "false"
      MAX_CONTENT_LENGTH: "26214400"
      MAX_UPLOAD_BYTES: "26214400"
      MESSAGE_ATTACHMENT_MAX_BYTES: "26214400"
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "default", "notifications", "maintenance"]
    depends_on:
      - postgres
      - redis
    volumes:
      - logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haradibots}
      POSTGRES_USER: ${POSTGRES_USER:-haradibots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  logs:
