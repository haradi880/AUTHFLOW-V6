services:
  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://authflow:authflow@postgres:5432/authflow
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://authflow:authflow@postgres:5432/authflow
      REDIS_URL: redis://redis:6379/0
      TASK_QUEUE_ASYNC: "true"
    command: ["rq", "worker", "-u", "redis://redis:6379/0", "default", "notifications", "maintenance"]
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/app/uploads:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authflow
      POSTGRES_USER: authflow
      POSTGRES_PASSWORD: authflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
  logs:
