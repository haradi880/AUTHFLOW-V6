name: CI

on:
  push:
  pull_request:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall app tests

      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

      - name: Static security scan
        run: python -m bandit -r app -x app/templates -f txt

      - name: Tests
        env:
          FLASK_ENV: testing
        run: pytest -q -W error::sqlalchemy.exc.LegacyAPIWarning

      - name: Production config unit checks
        run: pytest tests/test_production_checks.py tests/test_deployment_config.py -q

      - name: Route smoke check
        env:
          FLASK_ENV: testing
        run: flask --app app:create_app smoke-check --max-p95-ms 10000 --json

      - name: Route load check
        env:
          FLASK_ENV: testing
        run: flask --app app:create_app load-check --requests-per-target 2 --concurrency 2 --max-p95-ms 10000 --json
